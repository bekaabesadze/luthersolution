services:
  - type: web
    name: bank-analytics-backend
    env: python
    healthCheckPath: /health
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: FRONTEND_URL
        value: "https://luthersolution.com,https://www.luthersolution.com"
      - key: PYTHON_VERSION
        value: "3.10.0"
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1

# Optional Postgres migration (remove the disk block above when switching):
# databases:
#   - name: bank-analytics-db
#     plan: basic-256mb
# Then set DATABASE_URL on the web service:
#   envVars:
